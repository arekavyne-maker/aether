[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-testing"
version = "0.1.0"
description = "Aether testing harness — conformance runner and contract validator"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Crocell-Proprietary"
authors = [{ name = "Aether Platform Team" }]
dependencies = [
    "aether-sdk",
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["aether_testing*"]
