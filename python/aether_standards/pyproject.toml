[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-standards"
version = "0.1.0"
description = "Aether interchange-format adapters with declared semantic loss"
requires-python = ">=3.9"
license = { text = "LicenseRef-Crocell-Proprietary" }
dependencies = []

[project.optional-dependencies]
geometry = ["cadquery-ocp==7.7.2"]
hdf5 = ["h5py==3.11.0"]

[tool.setuptools.packages.find]
where = ["."]