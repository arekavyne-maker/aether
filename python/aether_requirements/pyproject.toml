[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-requirements"
version = "0.1.0"
description = "Aether Python SDK — requirements package (SysML v2 textual subset + verification coverage, SDP §11.3)"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Crocell-Proprietary"
authors = [{ name = "Aether Platform Team" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.7", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["aether_requirements*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "PT", "RET", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.9"
strict = true
