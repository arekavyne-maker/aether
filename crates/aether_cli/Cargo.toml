[package]
name = "aether_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Aether canonical CLI (G1 deliverable: init|project|graph|requirement|plugin|package|provenance subset; Phase 0: TUF verifier and dark-build smoke)."

[[bin]]
name = "aether"
path = "src/main.rs"

[lib]
name = "aether_cli"
path = "src/lib.rs"

[features]
default = []
g2 = []  # Phase 2: workflow + plugin lifecycle commands

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
aether_graph = { path = "../aether_graph" }
aether_provenance = { path = "../aether_provenance" }
aether_workflow = { path = "../aether_workflow" }
aether_exec = { path = "../aether_exec" }
aether_compose = { path = "../aether_compose" }
aether_registry = { path = "../aether_registry" }
aether_policy = { path = "../aether_policy" }
aether_envman = { path = "../aether_envman" }
aether_quantities = { path = "../aether_quantities" }
aether_artifacts = { path = "../aether_artifacts" }
aether_asm = { path = "../aether_asm" }
aether_evidence = { path = "../aether_evidence" }
aether_manufacturing = { path = "../aether_manufacturing" }
aether_model_registry = { path = "../aether_model_registry" }
aether_fidelity = { path = "../aether_fidelity" }
aether_design = { path = "../aether_design" }
aether_agents = { path = "../aether_agents" }
aether_vv = { path = "../aether_vv" }
aether_materials = { path = "../aether_materials" }
aether_loads = { path = "../aether_loads" }
aether_model_runtime = { path = "../aether_model_runtime" }
aether_agent_runtime = { path = "../aether_agent_runtime" }
aether_classification = { path = "../aether_classification" }
aether_observability = { path = "../aether_observability" }
aether_identity = { path = "../aether_identity" }
