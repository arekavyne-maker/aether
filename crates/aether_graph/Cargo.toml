[package]
name = "aether_graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Aether Engineering Graph engine + AQL (G1 deliverable: event-sourced graph with AQL subset, AS-OF, and a storage SPI for SQLite/PostgreSQL)."

[lib]
name = "aether_graph"
path = "src/lib.rs"

[[bin]]
name = "aether_graph_scale"
path = "src/bin/scale.rs"

[dependencies]
aether_policy = { path = "../aether_policy" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tokio = { workspace = true }
tokio-postgres = { version = "0.7", optional = true }

[features]
default = []
postgres = ["dep:tokio-postgres"]

[dev-dependencies]
tempfile = "3.10"
