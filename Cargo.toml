[workspace]
resolver = "2"
members = [
    "crates/aether_kernel",
    "crates/aether_graph",
    "crates/aether_workflow",
    "crates/aether_provenance",
    "crates/aether_policy",
    "crates/aether_registry",
    "crates/aether_exec",
    "crates/aether_envman",
    "crates/aether_compose",
    "crates/aether_cli",
    "crates/aether_sdk_ffi",
    "crates/aether_contract_validate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/arekavyne-maker/aether"
authors = ["Aether Platform Team"]

[workspace.dependencies]
# Stable, air-gap-friendly dependencies only. No network-dependent crates.
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: float parsing must be correctly rounded so the
# event-log hash chain is stable across the storage round trip
# (write: f64 -> JSON bytes; verify: JSON bytes -> f64 -> canonical
# JSON). Without it, float-bearing payloads can hash differently at
# verification time (1-ULP parse drift) and `graph chain` reports a
# false integrity failure.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.6", features = ["v7", "serde"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.29", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
