# Aether scientific-ML reference plugin manifest.
_schema_id: "https://aether.local/contracts/plugin.manifest/schema/manifest.schema.json"

manifest_version: "1.2"
plugin:
  id: "org.aether.reference.ml.scientific"
  name: "Aether Scientific ML"
  version: "0.1.0"
  vendor: "Crocell Company"
  license_ref: "LicenseRef-Crocell-Proprietary"
contracts:
  - id: "aether.surrogate.builder"
    version: ">=0.1.0 <1.0.0"
    role: "implements"
capabilities:
  scientific_ml:
    methods: [reservoir, sindy, dmd, spectral_operator, pinn_fit]
    validation: [grouped, external, ood]
    production_approved: false
    promotion: "ADR-0038"
compute:
  cpu: true
  gpu: false
  mpi_distributed: false
  accelerator_optional: false
resources:
  defaults: {memory_gb: 2, cores: 1}
  maximums: {memory_gb: 16, cores: 8}
isolation:
  level: "process"
  filesystem: "scoped"
  network: "deny"
runtime:
  entry:
    kind: "python-stdio"
    path: "python/stdio_plugin.py"
    args: []
airgap:
  offline_install: true
provenance_template: "prov/ml-run.v1.json"
policy:
  data_residency: "local_only"
  export_class: "PUBLIC"